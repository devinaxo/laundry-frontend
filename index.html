<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image" href="/laundromat.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema del 13</title>
    <script> (function() { try { const theme = localStorage.getItem('vite-ui-theme') || 'light'; if (theme === 'dark') { document.documentElement.classList.add('dark'); } else if (theme === 'system') { const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches; if (isDark) document.documentElement.classList.add('dark'); } } catch (e) {} })(); </script>
    <style> body { background-color: hsl(210, 40%, 98%); transition: background-color 0.2s ease; } .dark body { background-color: hsl(222.8571, 84%, 4.9%); } </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
